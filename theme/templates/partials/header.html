<header class="bg-white/95 backdrop-blur-md shadow-soft sticky top-0 z-50 border-b border-primary-100" x-data="{ mobileMenuOpen: false }">
    <div class="container mx-auto px-3 sm:px-4 lg:px-8">
        <div class="flex items-center justify-between h-16 sm:h-20">
            <!-- Logo -->
            <a href="{% url 'home' %}" class="text-lg sm:text-xl lg:text-2xl font-bold bg-gradient-primary bg-clip-text text-transparent flex-shrink-0">NeoMed<span class="font-medium hidden sm:inline">Healthcare</span></a>

            <!-- Desktop Navigation -->
            <nav class="hidden lg:flex items-center space-x-4 xl:space-x-8">
                <a href="{% url 'about' %}" class="text-sm xl:text-base text-secondary-600 hover:text-primary-600 transition-all duration-300 font-medium relative group">
                    About
                    <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary-500 transition-all duration-300 group-hover:w-full"></span>
                </a>
                <a href="{% url 'tests:test_list' %}" class="text-sm xl:text-base text-secondary-600 hover:text-primary-600 transition-all duration-300 font-medium relative group">
                    All Tests
                    <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary-500 transition-all duration-300 group-hover:w-full"></span>
                </a>
                <a href="{% url 'tests:category_list' %}" class="text-sm xl:text-base text-secondary-600 hover:text-primary-600 transition-all duration-300 font-medium relative group">
                    Categories
                    <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary-500 transition-all duration-300 group-hover:w-full"></span>
                </a>
                <a href="{% url 'blog:home' %}" class="text-sm xl:text-base text-secondary-600 hover:text-primary-600 transition-all duration-300 font-medium relative group">
                    Blog
                    <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary-500 transition-all duration-300 group-hover:w-full"></span>
                </a>
                <a href="{% url 'tests:anonymous_test_list' %}" class="text-sm xl:text-base text-secondary-600 hover:text-primary-600 transition-all duration-300 font-medium relative group">
                    Anonymous
                    <span class="absolute -bottom-1 left-0 w-0 h-0.5 bg-primary-500 transition-all duration-300 group-hover:w-full"></span>
                </a>
            </nav>

            <!-- Icons & Actions -->
            <div class="flex items-center space-x-2 sm:space-x-3 lg:space-x-4">
                <a href="{% url 'consultation:consultation_home' %}" class="hidden md:inline-block text-xs lg:text-sm font-semibold text-primary-700 bg-primary-50 px-2 lg:px-4 py-1 lg:py-2 rounded-full hover:bg-primary-100 hover:text-primary-800 transition-all duration-300 border border-primary-200">Consult</a>
                <a href="{% url 'bookings:check_result' %}" class="hidden md:inline-block text-xs lg:text-sm font-semibold text-secondary-700 bg-secondary-50 px-2 lg:px-4 py-1 lg:py-2 rounded-full hover:bg-secondary-100 hover:text-secondary-800 transition-all duration-300 border border-secondary-200">Results</a>
                <!-- Search functionality -->
                <div class="hidden sm:block relative" x-data="{ searchOpen: false }">
                    <button @click="searchOpen = !searchOpen" class="text-secondary-500 hover:text-primary-600 transition-all duration-300 p-2 rounded-full hover:bg-primary-50">
                        <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 lg:h-6 lg:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z" /></svg>
                    </button>
                    <!-- Search dropdown -->
                    <div x-show="searchOpen" @click.away="searchOpen = false" x-transition class="absolute right-0 mt-2 w-80 bg-white rounded-xl shadow-strong border border-primary-200 p-4 z-50">
                        <form method="get" action="{% url 'tests:test_list' %}">
                            <div class="flex space-x-2">
                                <input type="text" name="q" placeholder="Search tests, descriptions, categories..." 
                                       class="flex-1 rounded-lg border border-primary-300 px-3 py-2 text-sm focus:outline-none focus:ring-2 focus:ring-primary-500 focus:border-transparent">
                                <button type="submit" class="bg-primary-600 hover:bg-primary-700 text-white px-4 py-2 rounded-lg transition-colors">
                                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M21 21l-6-6m2-5a7 7 0 11-14 0 7 7 0 0114 0z"></path>
                                    </svg>
                                </button>
                            </div>
                        </form>
                    </div>
                </div>

                <!-- Dynamic Cart Icon -->
                <a href="{% url 'bookings:cart_detail' %}" class="relative text-secondary-500 hover:text-primary-600 transition-all duration-300 p-2 rounded-full hover:bg-primary-50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 lg:h-6 lg:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 3h2l.4 2M7 13h10l4-8H5.4M7 13L5.4 5M7 13l-2.293 2.293c-.63.63-.184 1.707.707 1.707H17m0 0a2 2 0 100 4 2 2 0 000-4zm-8 2a2 2 0 11-4 0 2 2 0 014 0z" /></svg>
                    {% if cart|length > 0 %}
                    <span class="absolute -top-1 -right-1 sm:-top-2 sm:-right-2 bg-gradient-to-r from-error-500 to-error-600 text-white text-xs font-bold w-4 h-4 sm:w-5 sm:h-5 flex items-center justify-center rounded-full shadow-medium animate-pulse">
                        {{ cart|length }}
                    </span>
                    {% endif %}
                </a>

                <!-- START: Dynamic User Icon -->
                {% if user.is_authenticated %}
                    <!-- User dropdown menu -->
                    <div class="relative" x-data="{ userMenuOpen: false }">
                        <button @click="userMenuOpen = !userMenuOpen" class="text-secondary-500 hover:text-success-600 transition-all duration-300 p-2 rounded-full hover:bg-success-50" title="Your Account">
                            <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 lg:h-6 lg:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M16 7a4 4 0 11-8 0 4 4 0 018 0zM12 14a7 7 0 00-7 7h14a7 7 0 00-7-7z" /></svg>
                        </button>
                        <!-- Dropdown menu -->
                        <div x-show="userMenuOpen" @click.away="userMenuOpen = false" x-transition class="absolute right-0 mt-2 w-48 bg-white rounded-xl shadow-strong border border-primary-200 py-2 z-50">
                            <a href="{% url 'users:dashboard' %}" class="block px-4 py-2 text-sm text-secondary-700 hover:bg-primary-50 hover:text-primary-600 transition-colors">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M3 7v10a2 2 0 002 2h14a2 2 0 002-2V9a2 2 0 00-2-2H5a2 2 0 00-2-2z"></path>
                                </svg>
                                Dashboard
                            </a>
                            <a href="{% url 'users:health_profile' %}" class="block px-4 py-2 text-sm text-secondary-700 hover:bg-primary-50 hover:text-primary-600 transition-colors">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                                </svg>
                                Health Profile
                            </a>
                            <hr class="my-2 border-secondary-200">
                            <a href="{% url 'users:logout' %}" class="block px-4 py-2 text-sm text-error-600 hover:bg-error-50 transition-colors">
                                <svg class="w-4 h-4 inline mr-2" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M17 16l4-4m0 0l-4-4m4 4H7m6 4v1a3 3 0 01-3 3H6a3 3 0 01-3-3V7a3 3 0 013-3h4a3 3 0 013 3v1"></path>
                                </svg>
                                Logout
                            </a>
                        </div>
                    </div>
                {% else %}
                    <!-- If user is logged out, show link to login page -->
                    <a href="{% url 'users:login' %}" class="text-secondary-500 hover:text-accent-600 transition-all duration-300 p-2 rounded-full hover:bg-accent-50" title="Log In / Register">
                         <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5 lg:h-6 lg:w-6" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 16l-4-4m0 0l4-4m-4 4h12m-2 4v-4m3 4v-4M15 8V4a2 2 0 00-2-2H5a2 2 0 00-2 2v16a2 2 0 002 2h8a2 2 0 002-2v-4" /></svg>
                    </a>
                {% endif %}
                <!-- END: Dynamic User Icon -->

                 <!-- Mobile Menu Button -->
                <button @click="mobileMenuOpen = !mobileMenuOpen" class="lg:hidden text-secondary-500 hover:text-primary-600 transition-all duration-300 p-2 rounded-full hover:bg-primary-50">
                    <svg xmlns="http://www.w3.org/2000/svg" class="h-5 w-5" fill="none" viewBox="0 0 24 24" stroke="currentColor"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7" /></svg>
                </button>
            </div>
        </div>
    </div>
    <!-- Mobile Menu Panel -->
    <div x-show="mobileMenuOpen" @click.away="mobileMenuOpen = false" class="lg:hidden bg-white/95 backdrop-blur-md border-t border-primary-200 shadow-soft" x-transition>
        <div class="px-3 pt-2 pb-3 space-y-1">
            <a href="{% url 'about' %}" class="block px-4 py-3 rounded-xl text-sm font-medium text-secondary-700 hover:text-primary-600 hover:bg-primary-50 transition-all duration-300">About</a>
            <a href="{% url 'tests:test_list' %}" class="block px-4 py-3 rounded-xl text-sm font-medium text-secondary-700 hover:text-primary-600 hover:bg-primary-50 transition-all duration-300">All Tests</a>
            <a href="{% url 'tests:category_list' %}" class="block px-4 py-3 rounded-xl text-sm font-medium text-secondary-700 hover:text-primary-600 hover:bg-primary-50 transition-all duration-300">Categories</a>
            <a href="{% url 'blog:home' %}" class="block px-4 py-3 rounded-xl text-sm font-medium text-secondary-700 hover:text-primary-600 hover:bg-primary-50 transition-all duration-300">Blog</a>
            <a href="{% url 'tests:anonymous_test_list' %}" class="block px-4 py-3 rounded-xl text-sm font-medium text-secondary-700 hover:text-primary-600 hover:bg-primary-50 transition-all duration-300">Anonymous Tests</a>
            <a href="{% url 'consultation:consultation_home' %}" class="block px-4 py-3 rounded-xl text-sm font-medium text-secondary-700 hover:text-primary-600 hover:bg-primary-50 transition-all duration-300 md:hidden">Consultation</a>
            <a href="{% url 'bookings:check_result' %}" class="block px-4 py-3 rounded-xl text-sm font-medium text-secondary-700 hover:text-primary-600 hover:bg-primary-50 transition-all duration-300">Check Results</a>
        </div>
    </div>
</header>
